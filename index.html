<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply saved preferences before the first paint.
      try {
        const theme = localStorage.getItem('frame-theme')
        const language = localStorage.getItem('frame-language')
        document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'
        document.documentElement.lang = ['en', 'nl', 'de', 'fr'].includes(language) ? language : 'en'
      } catch {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <link rel="canonical" href="%SITE_URL%" />
    <meta property="og:site_name" content="%SITE_BRAND%" />
    <meta property="og:title" content="%SITE_BRAND% — Photography" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
    <title>%SITE_BRAND% — Photography</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
